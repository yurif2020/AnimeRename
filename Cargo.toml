[package]
name = "anime_rename"
version = "1.0.0"
edition = "2021"
description = "动漫文件夹/文件名批量重命名为中文（Bangumi 查询 + 系统代理）"

[[bin]]
name = "AnimeRename"
path = "src/main.rs"

[dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["list-view", "combobox", "textbox"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-normalization = "0.1"
rfd = "0.17"

[profile.release]
opt-level = 2
strip = true
codegen-units = 16
